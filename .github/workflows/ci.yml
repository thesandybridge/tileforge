name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # rust-s3 parses XML only from the operator-configured S3/MinIO endpoint.
      # Its quick-xml 0.38 constraint cannot currently take the upstream fix;
      # uploaded GeoTIFF contents never enter this parser.
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0194,RUSTSEC-2026-0195

      - name: Run tests
        run: RUSTFLAGS="-D warnings" cargo test --release --workspace --exclude tileforge-wasm

      - name: Run clippy
        run: cargo clippy --workspace --exclude tileforge-wasm -- -D warnings

      - name: Check WASM bridge
        run: cargo check --package tileforge-wasm --target wasm32-unknown-unknown

  web-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tileforge_test
          POSTGRES_USER: tileforge
          POSTGRES_PASSWORD: tileforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tileforge -d tileforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Audit npm dependencies
        run: npm audit
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Run auth policy tests
        run: npm run test:auth
        working-directory: web
        env:
          TEST_DATABASE_URL: postgres://tileforge:tileforge@localhost:5432/tileforge_test
