name: Build and Test WASM

on:
  push:
    paths:
      - "crates/**"
    branches: [main]
  pull_request:
    paths:
      - "crates/**"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM
        run: wasm-pack build crates/wasm --target no-modules --out-dir ../../web/public/wasm --release

      - name: Test WASM build
        run: |
          if [ ! -f web/public/wasm/tileforge_wasm_bg.wasm ]; then
            echo "WASM build failed - output file not found"
            exit 1
          fi
          echo "WASM build successful"
