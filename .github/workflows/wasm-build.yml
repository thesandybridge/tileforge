name: Build WASM

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release --workspace --exclude tileforge-wasm

      - name: Run clippy
        run: cargo clippy --workspace --exclude tileforge-wasm -- -D warnings

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        working-directory: web

  build-wasm:
    needs: [rust-tests, web-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM
        run: wasm-pack build crates/wasm --target no-modules --out-dir ../../web/public/wasm --release

      - name: Commit WASM
        run: |
          rm -f web/public/wasm/.gitignore
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/wasm/
          if ! git diff --staged --quiet; then
            git commit -m "build: update WASM output [skip ci]"
            git push
          else
            echo "No WASM changes to commit"
          fi
